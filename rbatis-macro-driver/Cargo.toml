[package]
name = "rbatis-macro-driver"
version = "4.9.3"
edition = "2021"
description = "The Rust SQL Toolkit and ORM Library. An async, pure Rust SQL crate featuring compile-time Dynamic SQL"
readme = "Readme.md"
authors = ["ce <zhuxiujia@qq.com>"]
license = "Apache-2.0"
categories = ["database"]
keywords = ["database", "orm", "mysql", "postgres", "sqlite"]
documentation = "https://docs.rs/rbatis-macro-driver/latest"
repository = "https://github.com/rbatis/rbatis"
homepage = "https://rbatis.github.io/rbatis.io"

# docs.rs build options: build with every feature and enable the `docsrs` cfg.
[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
default = ["rbatis-codegen"]
debug_mode = ["rbatis-codegen"]
# control println gen function
println_gen = ["rust-format", "rbatis-codegen"]
[lib]
proc-macro = true
[dependencies]
proc-macro2 = "1.0"
quote = "1.0"
syn = { version = "3.0", features = ["full"] }
rbatis-codegen = { version = "4.9", path = "../rbatis-codegen", optional = true }
rust-format = { version = "0.3.4", optional = true }
dark-std = "0.2"




